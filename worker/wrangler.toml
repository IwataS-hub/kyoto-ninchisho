name = "kyoto-ninchisho-consult"
main = "worker.js"
compatibility_date = "2026-07-01"

# APIキーは wrangler secret で設定する（このファイルやコードには絶対に書かない）:
#   npx wrangler secret put GEMINI_API_KEY

# 検証用Worker（本番とは別のWorker）。藤田先生の意見を受けた修正（feature/fujita-feedback）の
# 確認に使い、採用が決まるまで本番Worker（kyoto-ninchisho-consult）には deploy しない:
#   npx wrangler secret put GEMINI_API_KEY --env staging
#   npx wrangler deploy --env staging
# 不採用になった場合の削除: npx wrangler delete --env staging
[env.staging]
name = "kyoto-ninchisho-consult-staging"

# 検証用Workerだけ、評価スクリプト（層2・層3）を回せるようにレート上限を上げる。
# 本番には vars を設定しないので、本番の上限は worker.js の既定値（1日50）のまま。
[env.staging.vars]
RATE_LIMIT_PER_DAY = "300"
